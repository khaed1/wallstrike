[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc_version = "0.8.30"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
fs_permissions = [{ access = "read", path = "./" }]

[profile.default.fuzz]
runs = 512

[rpc_endpoints]
mainnet = "${MAINNET_RPC_URL}"

[lint]
lint_on_build = false
